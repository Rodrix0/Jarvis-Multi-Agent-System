<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis · personaje animado</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0c0e;color:#f4f1f2;font:16px system-ui,sans-serif}.card{width:min(820px,94vw);padding:32px;border:1px solid #453038;border-radius:24px;background:#151517}small{color:#ff777e;letter-spacing:.12em}h1{font-size:32px;margin:12px 0}p{color:#b4aab0;line-height:1.6}.stage{display:grid;place-items:center;min-height:350px;background:radial-gradient(ellipse at 50% 80%,#30141c,#101012 70%);border-radius:16px;margin:24px 0}.character{height:330px;width:294px}.character canvas{width:100%;height:100%;display:block}nav{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;color:#f4f1f2;border:1px solid #514047;background:#23161b;border-radius:10px;padding:10px 14px;cursor:pointer}button[aria-pressed=true]{background:#c41e36;color:#ffffff;border-color:#c41e36}footer{font-size:13px;color:#b4aab0;margin-top:20px}</style></head>
<body><main class="card"><small>JARVIS / PERSONAJE LOCAL</small><h1>Tu personaje, en movimiento.</h1><p>El modelo que compartiste, animado a partir de su imagen original. Elegí una acción para verlo.</p><section class="stage"><div class="character" id="character" data-state="idle"></div></section><nav aria-label="Animaciones"></nav><footer><label><input type="checkbox" id="motion" checked> Animar personaje</label><p>Sin programas pagos ni WebGL. La animación se pausa al ocultar esta pestaña; también podés pausarla con este control.</p></footer></main>
<script src="character-rig.js"></script><script>
const actions={idle:'Respirar',wave:'Saludar',walk:'Caminar',working:'Trabajar',sit:'Descansar',exercise:'Ejercitarse',celebrate:'Tarea terminada',question:'Preguntar',listening:'Escuchar',speaking:'Hablar'};
const motion=document.getElementById('motion');motion.onchange=()=>window.dispatchEvent(new CustomEvent('jarvis-companion-motion',{detail:{enabled:motion.checked}}));motion.onchange();
JarvisRig.mount(document.getElementById('character')).then(instance=>{window.previewInstance=instance;if(!instance)return;for(const [name,label] of Object.entries(actions)){const button=document.createElement('button');button.textContent=label;button.dataset.animation=name;button.setAttribute('aria-pressed',name==='wave'?'true':'false');button.onclick=()=>{document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed','true');instance.setAnimation(name);};document.querySelector('nav').append(button);}instance.setAnimation('wave');});
</script></body></html>
